name: Narration test suite

# Runs the full recorded-narration regression suite (manifest/pool
# integrity, full-game gates, matched-pair observable-equivalence tests,
# failure-mode handling) in a clean, stable GitHub-hosted runner. This
# exists because the suite's ~15-20 minute runtime repeatedly outlived
# the ephemeral sandbox container used for local development (see PR
# discussion on Batch 7 / issue #7) — a stable environment was needed so
# this suite can finish end to end and gate merges reliably.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  narration-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Ensure ffmpeg (for WAV-decoded audio fixtures)
        # ubuntu-latest runners ship with ffmpeg preinstalled; only hit
        # apt (and its slow `update`) on the rare runner image that
        # doesn't have it, instead of paying that cost on every run.
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Run narration test suite
        run: npm run test:narration -- test-evidence/ci-narration-check

      - name: Upload test evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: narration-suite-evidence
          path: test-evidence/ci-narration-check/
          retention-days: 14
