name: Voice asset integrity

on:
  pull_request:
    paths:
      - 'voice-production/**'
      - 'assets/audio/hosts/**'
      - '.github/workflows/voice-assets.yml'
  push:
    branches: [feature/six-host-voice-assets-20261101]
    paths:
      - 'voice-production/**'
      - 'assets/audio/hosts/**'
      - '.github/workflows/voice-assets.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify-existing-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: FedericoCarboni/setup-ffmpeg@v3
        timeout-minutes: 3
      - name: Verify catalogue, MP3 decoding and checksums
        run: python voice-production/asset_checks.py
      - name: Check import, corruption and duplicate-generation guards
        run: python -m unittest discover -s voice-production -p 'test_*.py'
      - name: Verify controlled batch proposal
        run: python voice-production/plan_batch.py
